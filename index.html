<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muntrume Engineering Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f3f4f6; }
        .engine-panel { border: 1px solid #1f2937; }
        .nav-link { transition: all 0.3s ease; }
    </style>
</head>
<body class="font-mono">

    <!-- Header Integrado -->
    <header class="bg-black/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <div class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black text-green-500">> MUNTRUME_CORE</a>
            <nav>
                <ul class="flex space-x-8 text-xs font-bold uppercase tracking-widest text-gray-400">
                    <li><a href="index.html" class="hover:text-green-500 transition">Home</a></li>
                    <li><a href="about.html" class="hover:text-green-500 transition">About</a></li>
                    <li><a href="team.html" class="text-white">Team</a></li>
                    <li><a href="news.html" class="hover:text-green-500 transition">News</a></li>
                    <li><a href="contact.html" class="hover:text-green-500 transition underline decoration-green-500">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Console -->
    <main class="container mx-auto px-6 py-12 max-w-3xl">
        <section id="engineering-core">
            <h1 class="text-2xl font-black mb-8 text-white">> ENGINEERING_DATA_ENGINE</h1>
            
            <div class="engine-panel bg-gray-900 p-8 rounded-2xl shadow-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <input type="text" id="car" placeholder="CAR_MODEL" class="bg-black p-4 rounded-lg border border-gray-700 outline-none focus:border-green-500">
                    <input type="text" id="track" placeholder="TRACK_NAME" class="bg-black p-4 rounded-lg border border-gray-700 outline-none focus:border-green-500">
                </div>
                
                <select id="mode" class="w-full bg-black p-4 rounded-lg border border-gray-700 mb-6 outline-none focus:border-green-500 text-gray-300">
                    <option value="qualifying">MODE: QUALIFYING_SETUP</option>
                    <option value="race">MODE: RACE_CONSISTENCY</option>
                    <option value="telemetry">MODE: TELEMETRY_ANALYSIS</option>
                </select>
                
                <button onclick="generateSetup()" id="genBtn" class="w-full bg-green-600 hover:bg-green-700 py-4 font-black rounded-lg transition uppercase tracking-widest">
                    Initialize Simulation
                </button>
                
                <div id="result" class="mt-8 p-6 bg-black border border-gray-800 rounded-lg min-h-[300px] leading-relaxed text-gray-400">
                    > Ready to compute parameters...
                </div>
            </div>
        </section>

        <!-- Discord -->
        <section id="discord-section" class="py-20">
            <h2 class="text-sm font-black mb-8 text-center uppercase tracking-widest text-gray-600">Paddock Access</h2>
            <div class="bg-white p-2 rounded-2xl">
                <iframe src="https://discord.com/widget?id=1188239582865661992&theme=dark" width="100%" height="400" frameborder="0" sandbox="allow-popups allow-same-origin allow-scripts"></iframe>
            </div>
        </section>
    </main>

    <script>
    async function generateSetup() {
        const btn = document.getElementById('genBtn');
        const resDiv = document.getElementById('result');
        const car = document.getElementById('car').value;
        const track = document.getElementById('track').value;
        const mode = document.getElementById('mode').value;
        
        if(!car || !track) { resDiv.innerText = "> ERROR: Car and Track fields are required."; return; }

        btn.disabled = true; btn.innerText = "COMPUTING...";
        resDiv.innerText = "> Running physics engine models... please wait.";

        try {
            const res = await fetch("https://muntrume.atrumin16.workers.dev", {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ car, track, mode })
            });
            const data = await res.json();
            resDiv.innerHTML = data.analysis.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        } catch (err) { resDiv.innerText = "> CRITICAL: Engine unreachable."; }
        finally { btn.disabled = false; btn.innerText = "Initialize Simulation"; }
    }
    </script>
</body>
</html>
